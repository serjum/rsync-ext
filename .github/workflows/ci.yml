name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-nautilus \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            gir1.2-secret-1 \
            rsync \
            openssh-client \
            sshpass \
            desktop-file-utils

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Compile Python sources
        run: PYTHONPATH=src python3 -m py_compile src/rsync_ext/*.py nautilus/*.py tests/*.py

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsync-ext-deb
          path: dist/*.deb
